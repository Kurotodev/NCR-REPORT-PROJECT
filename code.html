<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCR App</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="code.html" class="logo">Logo</a>
            <div class="header-right">
                <a class="active" href="code.html">Dashboard</a>
                <a class="quality" href="quality.html">Quality</a>
            </div>
        </div>
        
        <div class="main-content">
            <aside class="sidebar">
                <h2>Filter Options</h2>
                <form>
                    <fieldset>
                        <legend>Status</legend>
                        <div>
                            <input type="checkbox" id="chkOpen" name="open" value="">
                            <label for="chkOpen">Open</label>
                        </div>
                        <div>
                            <input type="checkbox" id="chkClosed" name="closed" value="">
                            <label for="chkClosed">Closed</label>
                        </div>
                    </fieldset>
                </form>
            </aside>
            <main>
                <div class="new-button">
                    <input type="button" id="btnNew" value="New">
                </div>
                <div class="list-header">
                    <h1>NCR List:</h1>
                </div>
                <div class="list-panel">
                    <div class="bottom-panel">
                        <div class="item"><span class="label-closed">Closed </span> NCR Number</div>
                        <div class="item"><span class="label-open">Opened </span> NCR Number</div>
                        <div class="item"><span class="label-closed">Closed </span> NCR Number</div>
                        <div class="item"><span class="label-open">Opened </span> NCR Number</div>
                        <div class="item"><span class="label-closed">Closed </span> NCR Number</div>
                        <div class="item"><span class="label-open">Opened </span> NCR Number</div>
                    </div>
                </div>
            </main>
        </div>
        <div class="footer">Hello</div>
    </div>
</body>
</html>
