<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossfire NCRs</title>
    <link rel="stylesheet" href="nic-style.css">
</head>

<body class="container">
    <header class="header">
        <img src="./Images/logo-transparent.png" alt="Crossfire Canada" width="180px" height="" />
        <ul>
            <li><a class="logout">Logout&#x23FB;</a></li>
        </ul>
    </header>

    <div class="content-wrap">
        <aside class="sidebar">
            <h3>Filter</h3>
            <form>
                <fieldset>
                    <legend>Status</legend>
                    <div>
                        <input type="checkbox" id="chkOpen" name="open" value="">
                        <label for="chkOpen">Open</label>
                    </div>
                    <div>
                        <input type="checkbox" id="chkClosed" name="closed" value="">
                        <label for="chkClosed">Closed</label>
                    </div>
                </fieldset>
            </form>
        </aside>
        <main>
            <h2>Home</h2>
            
            <button class="new-button" id="btnNew">Create New +</button>

            <div class="list-panel">
                <table>
                    <tr>
                        <th>NCR No.</th>
                        <th>Status</th>
                        <th>Date Created</th>
                    </tr>
                    <br>
                    <tr>
                        <td name="ncrNum">3912312312</td>
                        <td name="ncrStatus">Open</td>
                        <td name="ncrDateCreated">2025-10-05</td>
                    </tr>
                    <tr>
                        <td name="ncrNum">3912312312</td>
                        <td name="ncrStatus">Open</td>
                        <td name="ncrDateCreated">2025-10-05</td>
                    </tr>
                    <tr>
                        <td name="ncrNum">3912312312</td>
                        <td name="ncrStatus">Open</td>
                        <td name="ncrDateCreated">2025-10-05</td>
                    </tr>
                    <tr>
                        <td name="ncrNum">3912312312</td>
                        <td name="ncrStatus">Open</td>
                        <td name="ncrDateCreated">2025-10-05</td>
                    </tr>
                    <tr>
                        <td name="ncrNum">3912312312</td>
                        <td name="ncrStatus">Open</td>
                        <td name="ncrDateCreated">2025-10-05</td>
                    </tr>                    
                </table>
            </div>
        </main>
    </div>

    <footer>
        <p>&copy;Crossfire Canada</p>
    </footer>  
</body>
</html>
